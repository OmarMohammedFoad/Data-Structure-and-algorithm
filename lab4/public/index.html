<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            width: 300px;
            text-align: center;
        }

        h2 {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        .toggle {
            margin-top: 10px;
            color: blue;
            cursor: pointer;
        }

        .checkUser {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;

        }

        .inside-checker {
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2 id="form-title">Login</h2>
        <form id="auth-form" action="/home">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="pass" placeholder="Password" required>

            <div class="checkUser" id="checkUser">
                <div class="inside-checker">
                    <label for="">admin</label>
                    <input type="radio" id="admin" name="role">
                </div>
                <div class="inside-checker">
                    <label for="">user</label>
                    <input type="radio" id="user" name="role">
                </div>
            </div>


            <button type="submit">Submit</button>
        </form>
        <p class="toggle" onclick="toggleForm()">Don't have an account? Register</p>
    </div>

    <script>
        let isRegister = false;

        function toggleForm() {
            isRegister = !isRegister;
            document.getElementById("form-title").innerText = isRegister ? "Register" : "Login";
            document.querySelector(".toggle").innerText = isRegister ? "Already have an account? Login" : "Don't have an account? Register";
            document.getElementById("checkUser").style.display = isRegister ? "flex": "none";
        }

        document.getElementById("auth-form").addEventListener("submit", async function (event) {
            event.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("pass").value;
            const user = document.getElementById("user").checked;
            const admin = document.getElementById("admin").checked;
            console.log(email, " ", password, " ", user);



            if (isRegister) {
                await fetch('/user/register', {
                    method: "POST",
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password, role: user ? "user" : "admin" }),


                })
            } else {
                await fetch('/user/login', {
                    method: "POST",
                    headers: {
                        'Content-Type': 'application/json'

                    },
                    body: JSON.stringify({ email, password }),
                });


            }
        });
    </script>

</body>

</html>

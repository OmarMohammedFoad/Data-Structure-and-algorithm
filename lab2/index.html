<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex-column p-3 items-center justify-center">

    <div class="bg-white shadow-lg rounded-xl p-6 w-full">


        <form id="form" class="space-y-4">
            <div>
                <label for="id" class="block text-gray-700 font-medium">ID</label>
                <input type="number" name="id" class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <div>
                <label for="name" class="block text-gray-700 font-medium">Name</label>
                <input type="text" name="name" class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <div>
                <label for="brand" class="block text-gray-700 font-medium">Brand</label>
                <input type="text" name="brand" class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <div>
                <label for="price" class="block text-gray-700 font-medium">Price</label>
                <input type="number" name="price" class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <div>
                <label for="model" class="block text-gray-700 font-medium">Model</label>
                <input type="text" name="model" class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">
                Submit
            </button>
        </form>
    </div>

    <div  id="container"></div>

</body>
<script>
    const form = document.getElementById('form');
    const container = document.getElementById('container');
    let editingCarId=null;
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(form);

        let data = {
            id: formData.get('id'),
            name: formData.get('name'),
            brand: formData.get('brand'),
            price: formData.get('price'),
            model: formData.get('model'),
        };

        if (editingCarId) {
          await  updateCar(editingCarId,data)
        }else{
            await addCars(data);

        }


    });


    const addCars = async function (data) {
        console.log(data);

        try {
            const res = await fetch('/cars', {
                method: "POST",
                body: JSON.stringify(data),
                headers: {
                    "Content-Type": "application/json"
                },
            });


            const message = await res.json();
            form.reset();

            showData();
        } catch (error) {
            console.error('Error:', error);
            alert('Something went wrong!');
        }




    }


    const showData = async function () {
    try {
        const res = await fetch('/cars');
        const message = await res.json();
        console.log(message);
        container.innerHTML = "";
        message.forEach(element => {
            const newDiv = document.createElement('div');
            newDiv.classList.add('bg-white', 'shadow-md', 'p-4', 'rounded-lg', 'mt-4');

            const h3 = document.createElement('h3');
            const h4 = document.createElement('h4');
            const h5 = document.createElement('h5');
            const deleteCard = document.createElement('button');
            const edit = document.createElement('button');

            h3.textContent = `Name: ${element.name}`;
            h4.textContent = `Price: ${element.price}`;
            h5.textContent = `Brand: ${element.brand}`;
            deleteCard.textContent = "Delete";
            deleteCard.classList.add('bg-red-500', 'text-white', 'px-3', 'py-1', 'rounded-lg', 'hover:bg-red-600', 'transition');
            edit.textContent = "Edit";
            edit.classList.add('bg-blue-500', 'text-white', 'px-3', 'py-1', 'rounded-lg', 'hover:bg-blue-600', 'transition');

            deleteCard.addEventListener('click',()=>deleteCar(element.id));
            edit.addEventListener('click',()=>editCar(element.id,element));

            newDiv.appendChild(h3);
            newDiv.appendChild(h4);
            newDiv.appendChild(h5);
            newDiv.appendChild(deleteCard);
            newDiv.appendChild(edit);
            container.appendChild(newDiv);
        });

    } catch (error) {
        console.error('Error:', error);
    }
};
    
    const deleteCar = async function (id) {
    try {
        const res = await fetch(`/cars?id=${id}`, {
            method: "DELETE"
        });

        const data = await res.json();

        if (res.status === 201) {
            showData();
        } else {
            alert("Car not found!");
        }
    } catch (error) {
        console.error("Error deleting car:", error);
    }
};

const editCar = function (id, car) {
        form.elements['id'].value = car.id;
        form.elements['name'].value = car.name;
        form.elements['brand'].value = car.brand;
        form.elements['price'].value = car.price;
        form.elements['model'].value = car.model;
        console.log(id);
        
        editingCarId = id;
    };
    const updateCar = async function (id, data) {
        try {
            const res = await fetch(`/cars?id=${id}`, {
                method: "PUT",
                body: JSON.stringify(data),
                headers: {
                    "Content-Type": "application/json"
                },
            });

            const message = await res.json();
            showData();
            form.reset();
            editingCarId = null;

        } catch (error) {
            console.error('Error:', error);
            alert('Something went wrong!');
        }
    };

showData();

</script>

</html>
